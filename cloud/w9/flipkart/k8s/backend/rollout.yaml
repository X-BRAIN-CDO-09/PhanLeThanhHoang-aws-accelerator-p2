apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: flipkart-backend
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: flipkart-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flipkart-backend
  template:
    metadata:
      labels:
        app: flipkart-backend
    spec:
      containers:
        - name: backend
          image: flipkart-backend:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: flipkart-secrets
          env:
            - name: ERROR_RATE
              value: "0.5"
            - name: VERSION
              value: "v3-bad"
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  strategy:
    canary:
      analysis:
        templates:
        - templateName: success-rate
        startingStep: 1
      steps:
      - setWeight: 10
      - pause: {duration: 1m}
      - setWeight: 50
      - pause: {duration: 1m}
      - setWeight: 100
