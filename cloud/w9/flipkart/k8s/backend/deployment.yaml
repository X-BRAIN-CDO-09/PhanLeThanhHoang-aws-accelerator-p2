apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-backend
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: flipkart-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flipkart-backend
  template:
    metadata:
      labels:
        app: flipkart-backend
    spec:
      containers:
        - name: backend
          image: flipkart-backend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: flipkart-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
