# [w10-pm NEW] Created for w10_afternoon_secrets_supply_chain lab — Lab 2.1 ESO
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipkart-eso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/X-BRAIN-CDO-09/PhanLeThanhHoang-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w10/flipkart/k8s-eso
  destination:
    server: https://kubernetes.default.svc
    namespace: flipkart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
