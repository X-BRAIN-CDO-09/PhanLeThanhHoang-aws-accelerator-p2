# Bài 3: Image Signing với Cosign và Kyverno
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-image-signature
      match:
        resources:
          kinds:
            - Pod
      verifyImages:
      - image: "your-registry-username/*" 
        key: "k8s://kyverno/cosign-pub-key" # Hoặc paste key thẳng vào đây dạng key: |-
