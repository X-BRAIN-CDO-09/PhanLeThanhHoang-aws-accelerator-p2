apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: flipkart-backend
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: flipkart-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flipkart-backend
  template:
    metadata:
      labels:
        app: flipkart-backend
    spec:
      containers:
        - name: backend
          image: flipkart-backend:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: flipkart-secrets
          env:
            - name: ERROR_RATE
              value: "0"
            - name: VERSION
              value: "v1"
            # W10 Lab 2.1: read DB password from a mounted file, not env.
            - name: DB_PASSWORD_FILE
              value: /etc/flipkart/db/password
          volumeMounts:
            - name: db-password
              mountPath: /etc/flipkart/db
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # Synced from AWS Secrets Manager (prod/db/password) by ESO every 60s.
        # subPath is *not* set so kubelet does atomic symlink swaps in-place,
        # which is what makes the rotation visible to the running pod with
        # zero restart.
        - name: db-password
          secret:
            secretName: flipkart-db-password
            items:
              - key: password
                path: password
  strategy:
    canary:
      analysis:
        templates:
        - templateName: success-rate
        startingStep: 1
      steps:
      - setWeight: 10
      - pause: {duration: 1m}
      - setWeight: 50
      - pause: {duration: 1m}
      - setWeight: 100
