# [w10-pm NEW] Created for w10_afternoon_secrets_supply_chain lab — Lab 2.2 Cosign
# The Sigstore Policy Controller reads `cosign.pub` from this Secret.
# Keep its contents in sync with k8s-policy/cosign.pub.
#
# Generation flow at lab time:
#   cosign generate-key-pair                 # creates cosign.key + cosign.pub
#   kubectl create secret generic flipkart-cosign-pub \
#     -n cosign-system \
#     --from-file=cosign.pub=./cosign.pub \
#     --dry-run=client -o yaml > flipkart-cosign-pub.yaml
#
# Then paste the resulting `data.cosign.pub` (base64) in below and commit.
apiVersion: v1
kind: Secret
metadata:
  name: flipkart-cosign-pub
  namespace: cosign-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  cosign.pub: UkVQTEFDRV9NRV9CQVNFNjQK  # base64("REPLACE_ME_BASE64\n")
