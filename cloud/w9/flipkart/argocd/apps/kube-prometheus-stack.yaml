apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-smtp-credentials
          config:
            global:
              smtp_smarthost: 'smtp.gmail.com:587'
              smtp_from: 'hoangplt.work@gmail.com'
              smtp_auth_username: 'hoangplt.work@gmail.com'
              smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp-credentials/password'
            route:
              group_by: ['alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
              receiver: 'email-alerts'
              routes:
                - match:
                    severity: critical
                  receiver: 'email-alerts'
            receivers:
              - name: 'email-alerts'
                email_configs:
                  - to: 'hoangplt.work@gmail.com'
                    send_resolved: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
