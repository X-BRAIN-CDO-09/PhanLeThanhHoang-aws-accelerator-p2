apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-frontend
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: flipkart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flipkart-frontend
  template:
    metadata:
      labels:
        app: flipkart-frontend
    spec:
      containers:
        - name: frontend
          image: flipkart-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
