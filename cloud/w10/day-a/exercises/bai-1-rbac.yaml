# Bài 1: Phân quyền RBAC cơ bản
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-frontend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-developer
  namespace: team-frontend

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: team-frontend
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: team-frontend
subjects:
- kind: ServiceAccount
  name: frontend-developer
  namespace: team-frontend
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
