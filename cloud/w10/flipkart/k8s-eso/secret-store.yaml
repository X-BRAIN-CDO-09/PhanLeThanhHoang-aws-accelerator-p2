# [w10-pm NEW] Created for w10_afternoon_secrets_supply_chain lab — Lab 2.1 ESO
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      # On the W8/W10 Minikube node we authenticate via the EC2 instance
      # profile created in terraform/modules/compute (auth.jwt / auth.secretRef
      # are unset on purpose so ESO falls through to the default AWS SDK chain
      # → IMDSv2 → instance role).
