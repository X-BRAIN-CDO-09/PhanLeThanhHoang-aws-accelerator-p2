apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipkart-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/X-BRAIN-CDO-09/PhanLeThanhHoang-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w9/flipkart-mern/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: flipkart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
