# [w10-pm NEW] Created for w10_afternoon_secrets_supply_chain lab — Lab 2.1 ESO
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flipkart-db-password
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Lab 2.1: re-pull every 60s so a Secrets Manager rotation lands in-cluster
  # in < 1 minute. Combined with a subPath-free volume mount, the pod sees the
  # new value with no restart.
  refreshInterval: 60s
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: flipkart-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod/db/password
        property: password
