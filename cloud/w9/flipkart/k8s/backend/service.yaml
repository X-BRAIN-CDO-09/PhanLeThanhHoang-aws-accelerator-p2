apiVersion: v1
kind: Service
metadata:
  name: flipkart-backend
  namespace: flipkart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: flipkart-backend
spec:
  type: ClusterIP
  selector:
    app: flipkart-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
