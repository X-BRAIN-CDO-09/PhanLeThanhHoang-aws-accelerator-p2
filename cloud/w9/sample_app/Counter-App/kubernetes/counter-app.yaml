apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-app-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: counter-app
  template:
    metadata:
      labels:
        app: counter-app
    spec:
      containers:
      - name: counter-app
        image: hofang42/counter-app:loi-tum-lum
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: counter-app-svc
spec:
  type: NodePort
  selector:
    app: counter-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
