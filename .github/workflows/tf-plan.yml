name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloud/w9/sample_app/**' # Trỏ tới thư mục chứa code Terraform của bạn

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    # Khai báo các biến môi trường cần thiết để xác thực AWS. 
    # Lưu ý: Cần thêm credentials vào GitHub Secrets (Repository Settings -> Secrets -> Actions)
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-southeast-1" # Thay đổi region nếu cần

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init
        working-directory: cloud/w9/sample_app/terraform

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: cloud/w9/sample_app/terraform
        continue-on-error: true

      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: cloud/w9/sample_app/terraform